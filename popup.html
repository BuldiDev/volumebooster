<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="value">100%</div>
    <input id="slider" type="range" min="0" max="600" step="5" value="100" />
    <div id="row">
      <span id="hint">0% — 600%</span>
      <button id="reset">Reset</button>
    </div>
    <div id="error" hidden>This tab can't be boosted.</div>
    <script src="popup.js"></script>
  </body>
</html>
